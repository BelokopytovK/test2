name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную через вкладку Actions

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout кода
      uses: actions/checkout@v3

    - name: Настройка Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9' # Используем стабильную версию Python

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Сборка EXE файла
      run: |
        # --onefile: создать один исполняемый файл
        # --windowed: скрыть консольное окно (для GUI приложений)
        # --name: имя выходного файла
        # --icon: (опционально) путь к иконке, если есть
        pyinstaller --onefile --windowed --name "DesktopOrganizer" desktop_organizer.py

    - name: Загрузка артефакта
      uses: actions/upload-artifact@v3
      with:
        name: DesktopOrganizer-Windows
        path: dist/DesktopOrganizer.exe
        retention-days: 14 # Файл будет храниться 14 дней
